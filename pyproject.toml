[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel", "scikit_build_core"]
build-backend = "scikit_build_core.build"

[project]
name = "histogrammer"
description = "odin-control adapter project for Hexitec Histogrammer"
dynamic = ["version"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: >=3.10",
]
dependencies = [
    "odin-control>=2.0",
    "pybind11",
]

readme = "README.md"

[[project.authors]]
email = "ashley.neaves@stfc.ac.uk"
name = "Ashley Neaves"

[tool.scikit-build]
sdist.include = ["src/histogrammer/_version.py"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"


[tool.setuptools_scm]
# Optional settings for setuptools_scm
root = "."
write_to = "src/histogrammer/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"